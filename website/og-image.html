<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px; height: 630px; overflow: hidden;
  background: #0a0f1e; font-family: 'Inter', system-ui, sans-serif; display: flex;
}
.left { flex: 1; padding: 60px; display: flex; flex-direction: column; justify-content: center; }
.right {
  width: 380px; background: #111827; border-left: 1px solid #1f2937;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;
}
.badge {
  display: inline-block; background: #10b981; color: #fff;
  font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 4px; margin-bottom: 20px;
  text-transform: uppercase; letter-spacing: 0.08em;
}
h1 { font-size: 56px; font-weight: 800; color: #e8e8f0; line-height: 1.1; margin-bottom: 20px; }
h1 span { color: #10b981; }
p { font-size: 20px; color: #888899; line-height: 1.5; max-width: 460px; margin-bottom: 30px; }
.chip {
  display: inline-block; background: #1f2937; color: #e8e8f0;
  font-size: 13px; padding: 6px 14px; border-radius: 20px; margin: 4px; border: 1px solid #374151;
}
.metric {
  background: #1f2937; border: 1px solid #374151; border-radius: 8px;
  padding: 16px; margin: 6px 0; width: 100%; text-align: center;
}
.metric-num { font-size: 28px; font-weight: 800; color: #10b981; }
.metric-label { font-size: 12px; color: #888899; margin-top: 4px; }
.bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #10b981, #6366f1); }
.footer-credit { position: absolute; bottom: 20px; left: 60px; font-size: 13px; color: #555; }
</style>
</head>
<body>
<div class="left">
  <div class="badge">Open Source</div>
  <h1><span>Mentis</span></h1>
  <p>Mental wellness & productivity app</p>
  <div>
    <span class="chip">React 18</span>
    <span class="chip">TypeScript</span>
    <span class="chip">Vite</span>
    <span class="chip">Tailwind</span>
  </div>
</div>
<div class="right">
  <div class="metric"><div class="metric-num">100%</div><div class="metric-label">TypeScript Coverage</div></div>
  <div class="metric"><div class="metric-num">Vite</div><div class="metric-label">Fast Builds</div></div>
  <div class="metric"><div class="metric-num">Vitest</div><div class="metric-label">Unit Tests</div></div>
</div>
<div class="bottom-bar"></div>
<div class="footer-credit">Built by Babak Bandpey · cocode.dk · linkedin.com/in/babakbandpey</div>
</body>
</html>
